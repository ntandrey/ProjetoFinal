<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desconfia!</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="cabecalho-outras">


        <!-- Cards que levam a outras páginas quando um já foi clicado-->
        <nav class="cards-container-clicado">

            <!-- Card 1 -->
            <a href="index.html" class="card-golpe">
                <div class="quadrado-clicado">
                    <span class="icone-logo">!</span>
                    <p id="ajuste">Início</p>
                </div>
            </a>

            <!-- Card 2 -->
            <a href="sobre.html" class="card-golpe">
                <div class="quadrado-clicado">
                    <span class="simbolo">?</span>
                    <p>Sobre</p>
                </div>
            </a>

            <!-- Card 3 -->
            <a href="contato.html" class="card-golpe">
                <div class="quadrado-clicado ativo">
                    <span class="simbolo">✉</span>
                    <p>Contato</p>
                </div>
            </a>


        </nav>



    </header>

    <main>

        <!-- Seção da parte inicial -->
        <section class="secao-inicial">
            <div class="conteudo-texto-sobre">
                <div id="titulo-sobre">
                    <h1>Contatos<span class="vermelho">!</span></h1>
                </div>
                <div class="detalhe-linha"></div>

                <p class="texto-sobre">
                    Tem alguma <strong>dúvida</strong> sugestão ou quer entrar em contato com a gente? Fique à vontade
                    para nos enviar uma mensagem!
                </p>

                <p class="frase-final">
                    Fique atento. <span class="vermelho">Desconfie</span> sempre!
                </p>

                <nav class="cards-container-contato">

                    <!-- Card 1 -->
                    <a href="https://mail.google.com/mail/?view=cm&fs=1&to=ntandreyz@gmail.com" class="card-contato">
                        <div class="quadrado-contato">
                            <span class="simbolo-contato">✉</span>
                            <p id="ajuste">Email</p>
                        </div>
                    </a>

                    <!-- Card 2 -->
                    <a href="https://github.com/ntandrey/ProjetoFinal.git" class="card-contato">
                        <div class="quadrado-contato">
                            <span class="simbolo-contato">𑄝</span>
                            <p>GitHub</p>
                        </div>
                    </a>

                    <div class="conteudo-imagem-contato">
                        <img src="../img/imagem-contato.jpg" alt="interrogação">
                    </div>

                    <div class="traco-separador"></div>
        </section>

    </main>

    <footer class="rodape">
        <a href="index.html" class="logo">

            <!-- Símbolo do escudo com exclamação -->
            <span class="icone-logo">!</span>

            <!-- Texto depois do escudo -->
            <span class="nome-logo">
                Desconfia <span class="vermelho">!</span>
            </span>
        </a>

        <nav class="menu-rodape">
            <a href="sobre.html">Sobre</a>
            <span class="separador">│</span>

            <a href="contato.html">Contato</a>
            <span class="separador"></span>
        </nav>

    </footer>

</body>

</html>
